; Momentum-Dexed - Momentum with the Dexed FM engine (Synth_Dexed) in place of the subtractive engine
;
; Build:  pio run   (or open this repository in PlatformIO)
;
; Synth_Dexed is GPLv3, so this firmware is distributed under the GPLv3 (see LICENSE).

[platformio]
src_dir = src

[env:teensymm]
platform = teensy
board = teensymm
framework = arduino
; Synth_Dexed includes the Teensy Audio library: the dependency finder has to look into it
lib_ldf_mode = deep+
; AUDIO_BLOCK_SAMPLES=64 as the subtractive Momentum (Dexed renders in 64 sample steps)
build_flags = -D USB_MIDI_AUDIO_SERIAL -D ARDUINOJSON_ENABLE_PROGMEM=0 -D AUDIO_BLOCK_SAMPLES=64 -D MOMENTUM_FM
lib_deps =
	rlogiacco/CircularBuffer@^1.3.3
	ftrias/TeensyThreads@^1.0.1
	kurte/ILI9341_t3n@0.0.0-alpha+sha.f1bfb81825
	sukkopera/RokkitHash@0.0.0-alpha+sha.20151212
	janelia-arduino/Array@^1.2.1
	luni64/TeensyTimerTool@^1.2.0
	bblanchon/ArduinoJson@6.19.4
	Audio
	https://codeberg.org/dcoredump/Synth_Dexed.git#e3f524c8bd92cdd37d0aea2728ea991254dda8ab
